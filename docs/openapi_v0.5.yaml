openapi: 3.0.3
info:
  title: OSS-Mentor API
  version: 0.5.0
  description: |
    OSS-Mentor v0.5 API. GitHub OAuth login, developer profiles,
    candidate tasks, dual-track recommendations with explainable reasons,
    feedback, and system status.
    All responses include a `request_id` field. Errors use the unified
    `{error: {code, message, details?, request_id}}` shape.
servers:
  - url: http://127.0.0.1:8765
paths:
  /health:
    get:
      summary: Process health and database connectivity
      responses:
        "200": {description: API is available}
  /api/v1/auth/github/start:
    get:
      summary: Create an OAuth state and return the GitHub authorization URL
      parameters:
        - name: return_to
          in: query
          required: false
          schema: {type: string, default: "/"}
          description: Local absolute path to return to after login
      responses:
        "200": {description: Authorization URL, or oauth_configured=false with a clear message}
        "400": {description: Invalid return_to}
        "503": {description: Auth service not configured}
  /api/v1/auth/github/callback:
    get:
      summary: Validate OAuth state, exchange code, and create a session
      parameters:
        - name: code
          in: query
          required: true
          schema: {type: string}
        - name: state
          in: query
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Session created; oss_mentor_session cookie is set
          headers:
            Set-Cookie:
              schema: {type: string}
              description: HttpOnly; SameSite=Lax; local sessions last 7 days
        "303":
          description: Browser requests accepting text/html receive the same session cookie and a local return_to redirect
          headers:
            Location:
              schema: {type: string}
        "400": {description: Missing code or state}
        "401": {description: Invalid or expired OAuth state}
        "502": {description: GitHub upstream error}
  /api/v1/auth/logout:
    post:
      summary: Revoke the current local session
      responses:
        "200": {description: Session revoked; cookie cleared}
  /api/v1/me:
    get:
      summary: Return the current logged-in user
      responses:
        "200": {description: Current user public information}
        "401": {description: Login required}
        "503": {description: Auth service not configured}
  /api/v1/profiles:
    get:
      summary: List anonymous local profile templates (user-bound profiles excluded)
      responses:
        "200": {description: Profile template summaries}
  /api/v1/me/profile:
    get:
      summary: Read the signed-in user's profile and persisted suggestions
      security: [{SessionCookie: []}]
      responses:
        "200":
          description: Owned profile; no internal owner IDs
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileResponse"}
        "400": {$ref: "#/components/responses/ProfileError"}
        "401": {$ref: "#/components/responses/ProfileError"}
        "403": {$ref: "#/components/responses/ProfileError"}
        "404": {$ref: "#/components/responses/ProfileError"}
        "405": {$ref: "#/components/responses/ProfileError"}
        "409": {$ref: "#/components/responses/ProfileError"}
        "413": {$ref: "#/components/responses/ProfileError"}
        "415": {$ref: "#/components/responses/ProfileError"}
        "422": {$ref: "#/components/responses/ProfileError"}
        "429": {$ref: "#/components/responses/ProfileError"}
        "502": {$ref: "#/components/responses/ProfileError"}
        "503": {$ref: "#/components/responses/ProfileError"}
    put:
      summary: Create or replace the signed-in user's editable profile
      description: |
        No query parameters or owner identifiers are accepted. The server generates
        the profile key and provenance. Optional locks map canonical field names
        (including skills.Python) to booleans. Unchanged fields retain their provenance.
        Cross-origin browser writes are rejected. Create a profile before importing.
      security: [{SessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileWrite"}
      responses:
        "200":
          description: Created or updated owned profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileResponse"}
        "400": {$ref: "#/components/responses/ProfileError"}
        "401": {$ref: "#/components/responses/ProfileError"}
        "403": {$ref: "#/components/responses/ProfileError"}
        "404": {$ref: "#/components/responses/ProfileError"}
        "405": {$ref: "#/components/responses/ProfileError"}
        "409": {$ref: "#/components/responses/ProfileError"}
        "413": {$ref: "#/components/responses/ProfileError"}
        "415": {$ref: "#/components/responses/ProfileError"}
        "422": {$ref: "#/components/responses/ProfileError"}
        "429": {$ref: "#/components/responses/ProfileError"}
        "502": {$ref: "#/components/responses/ProfileError"}
        "503": {$ref: "#/components/responses/ProfileError"}
  /api/v1/me/profile/import-github:
    post:
      summary: Import a bounded public-data sample using the current OAuth session
      description: |
        Explicit current consent is required. Tokens are process-local only;
        after restart re-login is required (503), while manual profile access remains
        available. Collection verifies /user and samples at most 10 public repositories
        and 100 public events. It is not a complete contribution history. No private
        repository requests use authorization. On upstream failure nothing is persisted.
      security: [{SessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consent_version]
              properties:
                consent_version: {type: string, enum: [profile-import-consent-v0.1]}
      responses:
        "200":
          description: Persisted suggestions, preview and collection limitations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileImportResponse"}
        "400": {$ref: "#/components/responses/ProfileError"}
        "401": {$ref: "#/components/responses/ProfileError"}
        "403": {$ref: "#/components/responses/ProfileError"}
        "404": {$ref: "#/components/responses/ProfileError"}
        "405": {$ref: "#/components/responses/ProfileError"}
        "409": {$ref: "#/components/responses/ProfileError"}
        "413": {$ref: "#/components/responses/ProfileError"}
        "415": {$ref: "#/components/responses/ProfileError"}
        "422": {$ref: "#/components/responses/ProfileError"}
        "429": {$ref: "#/components/responses/ProfileError"}
        "502": {$ref: "#/components/responses/ProfileError"}
        "503": {$ref: "#/components/responses/ProfileError"}
  /api/v1/me/profile/suggestions/{suggestion_id}/accept:
    post:
      summary: Accept an owned pending suggestion atomically
      security: [{SessionCookie: []}]
      parameters:
        - name: suggestion_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9999999999999999999}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, maxProperties: 0}
      responses:
        "200":
          description: Persisted profile, resolved suggestion and all suggestion statuses
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileDecisionResponse"}
        "400": {$ref: "#/components/responses/ProfileError"}
        "401": {$ref: "#/components/responses/ProfileError"}
        "403": {$ref: "#/components/responses/ProfileError"}
        "404": {$ref: "#/components/responses/ProfileError"}
        "405": {$ref: "#/components/responses/ProfileError"}
        "409": {$ref: "#/components/responses/ProfileError"}
        "413": {$ref: "#/components/responses/ProfileError"}
        "415": {$ref: "#/components/responses/ProfileError"}
        "422": {$ref: "#/components/responses/ProfileError"}
        "429": {$ref: "#/components/responses/ProfileError"}
        "502": {$ref: "#/components/responses/ProfileError"}
        "503": {$ref: "#/components/responses/ProfileError"}
  /api/v1/me/profile/suggestions/{suggestion_id}/reject:
    post:
      summary: Reject an owned pending suggestion atomically
      security: [{SessionCookie: []}]
      parameters:
        - name: suggestion_id
          in: path
          required: true
          schema: {type: integer, minimum: 1, maximum: 9999999999999999999}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, maxProperties: 0}
      responses:
        "200":
          description: Persisted profile, resolved suggestion and all suggestion statuses
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProfileDecisionResponse"}
        "400": {$ref: "#/components/responses/ProfileError"}
        "401": {$ref: "#/components/responses/ProfileError"}
        "403": {$ref: "#/components/responses/ProfileError"}
        "404": {$ref: "#/components/responses/ProfileError"}
        "405": {$ref: "#/components/responses/ProfileError"}
        "409": {$ref: "#/components/responses/ProfileError"}
        "413": {$ref: "#/components/responses/ProfileError"}
        "415": {$ref: "#/components/responses/ProfileError"}
        "422": {$ref: "#/components/responses/ProfileError"}
        "429": {$ref: "#/components/responses/ProfileError"}
        "502": {$ref: "#/components/responses/ProfileError"}
        "503": {$ref: "#/components/responses/ProfileError"}
  /api/v1/tasks/{task_candidate_id}:
    get:
      summary: Task detail and current availability (member A)
      parameters:
        - name: task_candidate_id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200": {description: Task detail}
        "404": {description: Task not found}
  /api/v1/recommendations:
    get:
      summary: Recommendations for a stored profile with feedback state restore (member C)
      parameters:
        - name: profile_key
          in: query
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
      responses:
        "200": {description: Ranked RecommendationItemV3 list}
        "400": {description: Invalid query}
        "404": {description: Profile not found}
  /api/v1/recommendations/custom:
    post:
      summary: Transient custom-profile recommendations, kept for anonymous use (member C)
      responses:
        "200": {description: Recommendations; profile_persisted is false}
        "400": {description: Invalid custom profile, limit, or client ID}
  /api/v1/recommendation-options:
    post:
      summary: Live option inventory for the custom profile form (member C)
      responses:
        "200": {description: Option inventory}
        "400": {description: Invalid profile}
  /api/v1/feedback:
    post:
      summary: Save feedback state and append a state-change event (member C)
      responses:
        "200": {description: Feedback recorded}
        "400": {description: Invalid feedback payload}
        "404": {description: Task not found}
  /api/v1/feedback/summary:
    get:
      summary: Feedback funnel and state-transition statistics (member C)
      responses:
        "200": {description: Feedback summary}
  /api/v1/status:
    get:
      summary: System, database, sync, and candidate pool status
      responses:
        "200": {description: System status}
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: oss_mentor_session
  responses:
    ProfileError:
      description: |
        400 invalid_request/invalid_json/invalid_content_length; 401 authentication_required;
        403 insufficient_permission; 404 not_found; 405 method_not_allowed; 409 state_conflict;
        413 body_too_large; 415 unsupported_media_type; 422 profile_validation_failed;
        429 rate_limited; 502 github_upstream_error; 503 service_not_ready.
        Database and upstream exception details and credentials are never returned.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    ProfileWrite:
      type: object
      additionalProperties: false
      required: [service_track, preferred_languages, operating_systems, preferred_task_types, max_code_difficulty, max_setup_difficulty, desired_skill_stretch, skills]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 60, default: 自定义画像}
        service_track: {type: string, enum: [newcomer, growth]}
        preferred_languages:
          type: array
          minItems: 1
          maxItems: 6
          items: {type: string}
          description: Python, JavaScript, TypeScript, Java, Go or Rust (case-insensitive)
        operating_systems:
          type: array
          minItems: 1
          maxItems: 3
          items: {type: string, enum: [windows, macos, linux]}
        preferred_task_types:
          type: array
          minItems: 1
          maxItems: 6
          items: {type: string, enum: [bug_fix, testing, documentation, feature, refactor, build_tooling]}
        max_code_difficulty: {type: integer, minimum: 0, maximum: 3}
        max_setup_difficulty: {type: integer, minimum: 0, maximum: 3}
        desired_skill_stretch: {type: integer, minimum: 0, maximum: 2}
        skills:
          type: object
          minProperties: 1
          maxProperties: 24
          additionalProperties: {type: integer, minimum: 0, maximum: 4}
          description: Skill names are trimmed, case-insensitive, at most 50 characters, and cannot start with platform colon.
        locks:
          type: object
          additionalProperties: {type: boolean}
    StoredProfile:
      allOf:
        - {$ref: "#/components/schemas/CustomProfile"}
        - type: object
          required: [profile_key, field_metadata]
          properties:
            profile_key: {type: string}
            profile_source: {type: string, enum: [demo, user_input, import]}
            consent_version: {type: string}
            field_metadata:
              type: object
              additionalProperties:
                type: object
                properties:
                  source: {type: string}
                  locked: {type: boolean}
                  observed_at: {type: string, format: date-time, nullable: true}
    ProfileSuggestion:
      type: object
      required: [profile_field_suggestion_id, field_name, suggestion_source, field, source, current_value, proposed_value, confidence, evidence, observed_at, status, blocked_reason, resolved_at]
      properties:
        profile_field_suggestion_id: {type: integer, minimum: 1}
        field_name: {type: string}
        suggestion_source: {type: string}
        field: {type: string, description: Compatibility alias of field_name}
        source: {type: string, description: Compatibility alias of suggestion_source}
        current_value: {nullable: true}
        proposed_value: {nullable: true}
        confidence: {type: number, minimum: 0, maximum: 1}
        evidence: {type: array, items: {type: object}}
        observed_at: {type: string, format: date-time}
        status: {type: string, enum: [pending, accepted, rejected]}
        blocked_reason: {type: string, nullable: true}
        resolved_at: {type: string, format: date-time, nullable: true}
        import_key: {type: string}
        github_login: {type: string}
    ProfileResponse:
      type: object
      required: [profile, api_version, request_id]
      properties:
        profile: {$ref: "#/components/schemas/StoredProfile"}
        suggestions:
          type: array
          description: Included by GET, all statuses
          items: {$ref: "#/components/schemas/ProfileSuggestion"}
        consent_version: {type: string, description: Current import consent required by GET}
        api_version: {type: string}
        request_id: {type: string, format: uuid}
    ProfileImportResponse:
      type: object
      required: [profile_key, github_import, merge_preview, persistence, suggestions, collection, api_version, request_id]
      properties:
        profile_key: {type: string}
        github_import: {type: object}
        merge_preview: {type: object, description: Transient domain suggestions use field/source}
        persistence: {type: object}
        suggestions:
          type: array
          items: {$ref: "#/components/schemas/ProfileSuggestion"}
        collection: {type: object, description: Bounded sample limits and coverage caveats}
        api_version: {type: string}
        request_id: {type: string, format: uuid}
    ProfileDecisionResponse:
      type: object
      required: [profile, suggestion, suggestions, api_version, request_id]
      properties:
        profile: {$ref: "#/components/schemas/StoredProfile"}
        suggestion: {$ref: "#/components/schemas/ProfileSuggestion"}
        suggestions:
          type: array
          items: {$ref: "#/components/schemas/ProfileSuggestion"}
        api_version: {type: string}
        request_id: {type: string, format: uuid}
    CustomProfile:
      type: object
      required: [service_track, preferred_languages, operating_systems, preferred_task_types]
      properties:
        display_name: {type: string, maxLength: 60}
        service_track: {type: string, enum: [newcomer, growth]}
        preferred_languages: {type: array, items: {type: string}, maxItems: 8}
        operating_systems: {type: array, items: {type: string, enum: [windows, macos, linux]}, maxItems: 3}
        preferred_task_types:
          type: array
          items: {type: string, enum: [bug_fix, testing, documentation, feature, refactor, build_tooling]}
          maxItems: 6
        max_code_difficulty: {type: integer, minimum: 0, maximum: 3}
        max_setup_difficulty: {type: integer, minimum: 0, maximum: 3}
        desired_skill_stretch: {type: integer, minimum: 0, maximum: 2}
        skills:
          type: object
          additionalProperties: {type: integer, minimum: 0, maximum: 4}
          maxProperties: 24
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object}
            request_id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
