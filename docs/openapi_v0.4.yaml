openapi: 3.0.3
info:
  title: OSS-Mentor Local Recommendation API
  version: 0.4.0
  description: Local recommendations with hard preference constraints, live option inventory, transient custom profiles, and local feedback state.
servers:
  - url: http://127.0.0.1:8765
paths:
  /health:
    get:
      summary: Check local API availability
      responses:
        "200": {description: API is available}
  /api/v1/profiles:
    get:
      summary: List public-safe local profile templates
      responses:
        "200": {description: Profile template summaries}
  /api/v1/recommendations:
    get:
      summary: Recommend tasks for a stored profile and restore feedback states
      parameters:
        - name: profile_key
          in: query
          required: true
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
      responses:
        "200": {description: Ranked recommendations satisfying language and task-type constraints}
        "400": {description: Invalid query}
        "404": {description: Profile not found}
  /api/v1/recommendations/custom:
    post:
      summary: Recommend tasks for a transient custom profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                limit: {type: integer, minimum: 1, maximum: 100, default: 10}
                feedback_client_id: {type: string, format: uuid}
                profile: {$ref: "#/components/schemas/CustomProfile"}
      responses:
        "200": {description: Recommendations; profile_persisted is false}
        "400": {description: Invalid custom profile, limit, or client ID}
  /api/v1/recommendation-options:
    post:
      summary: Count currently matchable tasks for every selectable alternative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: {$ref: "#/components/schemas/CustomProfile"}
      responses:
        "200":
          description: Current combination and per-option inventory after all hard constraints
          content:
            application/json:
              schema:
                type: object
                required: [availability, api_version]
                properties:
                  api_version: {type: string, enum: [v0.4]}
                  availability:
                    type: object
                    required: [current_selection_count, language_counts, task_type_counts, operating_system_counts, language_task_type_counts]
                    properties:
                      current_selection_count: {type: integer, minimum: 0}
                      language_counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
                      task_type_counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
                      operating_system_counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
                      language_task_type_counts: {type: object}
        "400": {description: Invalid custom profile}
  /api/v1/feedback:
    post:
      summary: Save the current feedback state and append a change event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [task_candidate_id, feedback_context, feedback_state]
              properties:
                task_candidate_id: {type: integer, minimum: 1}
                feedback_context: {type: string, maxLength: 140}
                feedback_state:
                  type: string
                  enum: [interested, not_suitable, started, completed]
      responses:
        "200": {description: Current feedback and whether a new event was appended}
        "400": {description: Invalid feedback payload}
        "404": {description: Candidate task not found}
        "413": {description: Request body exceeds 32 KiB}
        "415": {description: Content-Type is not application/json}
components:
  schemas:
    CustomProfile:
      type: object
      required: [service_track, preferred_languages, operating_systems, preferred_task_types, max_code_difficulty, max_setup_difficulty, desired_skill_stretch, skills]
      properties:
        display_name: {type: string, minLength: 1, maxLength: 60}
        service_track: {type: string, enum: [newcomer, growth]}
        preferred_languages:
          type: array
          minItems: 1
          maxItems: 6
          items: {type: string, enum: [Python, JavaScript, TypeScript, Java, Go, Rust]}
        operating_systems:
          type: array
          minItems: 1
          maxItems: 3
          items: {type: string, enum: [windows, macos, linux]}
        preferred_task_types:
          type: array
          minItems: 1
          maxItems: 6
          items: {type: string, enum: [bug_fix, testing, documentation, feature, refactor, build_tooling]}
        max_code_difficulty: {type: integer, minimum: 0, maximum: 3}
        max_setup_difficulty: {type: integer, minimum: 0, maximum: 3}
        desired_skill_stretch: {type: integer, minimum: 0, maximum: 2}
        skills: {type: object, minProperties: 1, maxProperties: 24, additionalProperties: {type: integer, minimum: 0, maximum: 4}}
