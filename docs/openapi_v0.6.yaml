        request_id: {type: string}
    EnhancedProfileFeatures:
      type: object
      required:
        - schema_version
        - profile_state
        - profile_key
        - developer_key
        - profile_version
        - feature_schema_version
        - as_of
        - feature_names
        - values
        - observed_mask
        - locked_mask
        - current_interests
        - evidence_refs
        - interpretation
