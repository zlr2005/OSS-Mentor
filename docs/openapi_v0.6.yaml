        plan_id: {type: string}
        profile_key: {type: string}
        base_profile_version: {type: string}
        new_profile_version: {type: string}
        confirmed_at: {type: string, format: date-time}
        decisions: {type: array, items: {$ref: "#/components/schemas/ConfirmationDecision"}}
        applied_suggestion_ids: {type: array, items: {type: string}}
        rejected_suggestion_ids: {type: array, items: {type: string}}
        remaining_suggestion_ids: {type: array, items: {type: string}}
        blocked_suggestion_ids: {type: array, items: {type: string}}
        profile_state: {$ref: "#/components/schemas/ProfileFeatureState"}
        persisted: {type: boolean}
    AssessmentConfirmResponse:
      type: object
      required: [confirmation, api_version, request_id]
      properties:
        confirmation: {$ref: "#/components/schemas/AssessmentConfirmation"}
