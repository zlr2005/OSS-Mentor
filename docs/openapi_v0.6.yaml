        profile_version: {type: string}
        feature_schema_version: {type: string}
        as_of: {type: string, format: date-time}
        feature_names: {type: array, minItems: 1, items: {type: string}}
        values: {type: array, items: {type: number, minimum: 0, maximum: 1}}
        observed_mask: {type: array, items: {type: boolean}}
        locked_mask: {type: array, items: {type: boolean}}
        current_interests: {type: array, items: {type: string}}
        evidence_refs:
          type: array
          items: {type: array, items: {type: string}}
        interpretation: {type: string}
    EnhancedFeaturesResponse:
      type: object
      required: [features, api_version, request_id]
      properties:
        features: {$ref: "#/components/schemas/EnhancedProfileFeatures"}
        api_version: {type: string, enum: [v0.6]}
        request_id: {type: string}
    TaskDetail:
