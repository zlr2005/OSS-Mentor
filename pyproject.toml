[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-mentor"
version = "0.1.0"
description = "Data collection and recommendation research infrastructure for OSS-Mentor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]
gated-worker = [
    "pyarrow==21.0.0",
    "torch==2.9.0+cpu",
    "transformers==4.57.1",
]

[project.scripts]
oss-mentor = "oss_mentor.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

