<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全部推荐 · OSS-Mentor</title>
<meta name="description" content="OSS-Mentor 个性化推荐：按轨道筛选、查看推荐依据、记录反馈并进入任务详情。">
  <link rel="stylesheet" href="/assets/app.css?v=20261110-7">
<script src="/assets/ui.js" defer></script>
<script src="/assets/recommendations.js" defer></script>
</head>
<body data-page="recommendations">
<a class="skip" href="#main">跳到主要内容</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">OM</span>OSS-Mentor</a>
    <nav class="nav" aria-label="主导航">
      <a href="/recommendations" aria-current="page">全部推荐</a>
      <a href="/recommendation-run">推荐说明</a>
      <a href="/status">系统状态</a>
      <a href="/profile">个人信息</a>
    </nav>
    <div class="session" id="session-status" aria-label="当前账户与会话操作">
      <span class="avatar-mono" aria-hidden="true">?</span>
      <span class="who" role="status" aria-live="polite">正在读取会话<small>本地服务</small></span>
      <span class="pill pill--neutral" id="session-pill">…</span>
      <div class="session-actions" id="session-actions" role="group" aria-label="账户操作">
        <span class="session-action-loading">读取中</span>
      </div>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <h1 class="sr-only" id="recommendations-title">开源任务推荐</h1>
  <div id="run-context" hidden></div>

  <section class="rec-list-section" aria-labelledby="list-title">
    <div class="wrap">
      <div class="sec-head">
        <div class="sec-copy">
          <h2 id="list-title">本次运行的推荐结果</h2>
        </div>
        <div class="sec-head-tools">
          <div class="seg" id="recommendation-view" role="group" aria-label="推荐对象">
            <button class="view-btn" type="button" data-rec-view="issues" aria-pressed="true">Issue</button>
            <button class="view-btn" type="button" data-rec-view="repositories" aria-pressed="false">仓库</button>
          </div>
          <p class="note" id="list-note" role="status">正在读取推荐…</p>
        </div>
      </div>

      <div class="recommendation-workbench" id="recommendation-workbench">
        <div class="recommendation-results">
          <div class="banner" id="recommendation-message" hidden role="status"></div>

          <div class="toolbar" id="list-toolbar" hidden>
            <div class="seg" role="group" aria-label="按推荐轨道筛选">
              <button class="seg-btn" type="button" data-track="all" aria-pressed="true">全部 <span class="mono" id="track-count-all">0</span></button>
              <button class="seg-btn" type="button" data-track="newcomer" aria-pressed="false">新手 <span class="mono" id="track-count-newcomer">0</span></button>
              <button class="seg-btn" type="button" data-track="growth" aria-pressed="false">进阶 <span class="mono" id="track-count-growth">0</span></button>
            </div>
            <label class="search-field">
              <span class="sr-only">搜索仓库或标题</span>
              <input type="search" id="recommendation-search" placeholder="搜索仓库或标题" autocomplete="off">
            </label>
            <div class="spacer"></div>
            <button class="btn btn--sm btn--quiet" type="button" id="toggle-reasons" aria-pressed="false">展开全部推荐依据</button>
          </div>

          <div class="issue-list" id="issue-list" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </section>

  <section id="public-candidates" aria-labelledby="pub-title" hidden>
    <div class="wrap">
      <div class="sec-head">
        <div class="sec-copy">
          <h2 id="pub-title">未登录也能浏览的公开候选</h2>
        </div>
      </div>
      <div class="public-head">
        <span class="badge">公共候选</span>
        <p><strong>公共候选，不是根据你的画像生成的。</strong><span>它们当前开放、可用性待复核，没有匹配分、没有轨道判定，也不包含个性化依据；登录并完成画像后才能查看个性化推荐。</span></p>
      </div>
      <div class="public-grid" id="public-grid"></div>
    </div>
  </section>

  <section id="project-opportunities" hidden>
    <div class="wrap">
      <div class="proj-grid" id="proj-grid"></div>
    </div>
  </section>
</main>

</body>
</html>
