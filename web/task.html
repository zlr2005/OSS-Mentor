<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务详情 · OSS-Mentor</title>
<meta name="description" content="OSS-Mentor 任务详情：上游正文、技能要求、关联路径、通用开始步骤、贡献入口与推荐依据。">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/ui.js" defer></script>
<script src="/assets/task.js" defer></script>
</head>
<body data-page="task">
<a class="skip" href="#main">跳到主要内容</a>

<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">OM</span>OSS-Mentor</a>
    <nav class="nav" aria-label="主导航">
      <a href="/recommendations">全部推荐</a>
      <a href="/recommendation-run">推荐说明</a>
      <a href="/status">系统状态</a>
      <a href="/profile">个人信息</a>
    </nav>
    <div class="session" id="session-status" role="status" aria-live="polite">
      <span class="avatar-mono" aria-hidden="true">?</span>
      <span class="who">任务详情<small>本地候选快照</small></span>
      <span class="pill pill--neutral">detail</span>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <section class="page-head band" aria-labelledby="detail-page-title">
    <div class="wrap">
      <p class="crumbs"><a href="/recommendations">← 返回推荐</a><span aria-hidden="true">/</span><span>任务详情</span></p>
      <h1 id="detail-page-title">任务详情与开始步骤</h1>
      <p class="lead">先确认任务仍可领取，再阅读上游正文、技能要求与贡献指南。页面不会自动领取 Issue、发表评论或发起 PR。</p>
      <p class="head-meta">
        <span class="mono">task_candidate_id <span id="task-id-label">—</span></span>
        <span aria-hidden="true">·</span>
        <a href="/status">系统状态</a>
        <span aria-hidden="true">·</span>
        <a href="/recommendation-run">推荐说明</a>
      </p>
    </div>
  </section>

  <section class="rec-list-section" aria-labelledby="detail-title">
    <div class="wrap">
      <div class="banner" id="task-message" hidden role="status"></div>

      <div class="run-context" id="task-context" hidden></div>

      <div id="task-body" aria-live="polite">
        <div class="skel" role="status">
          <span class="sr-only">正在读取任务详情</span>
          <div class="skel-card" aria-hidden="true">
            <div class="sk sk--s"></div><div class="sk sk--t"></div><div class="sk"></div>
            <div class="sk sk--m"></div><div class="sk sk--s"></div>
          </div>
        </div>
      </div>

      <div class="detail-foot" id="task-actions" style="margin-top:18px" hidden>
        <div class="ic-actions" id="feedback-actions" role="group" aria-label="记录任务反馈">
          <button class="btn btn--sm btn--ghost" type="button" data-feedback="interested">感兴趣</button>
          <button class="btn btn--sm btn--ghost" type="button" data-feedback="not_suitable">不适合我</button>
          <button class="btn btn--sm btn--ghost" type="button" data-feedback="started">已开始</button>
          <button class="btn btn--sm btn--ghost" type="button" data-feedback="completed">已完成</button>
          <span class="feedback-status" id="feedback-note" role="status"></span>
        </div>
        <a class="btn btn--sm btn--ghost" id="task-github" href="#" target="_blank" rel="noopener noreferrer" hidden>查看 GitHub 原文</a>
        <button class="btn btn--sm btn--quiet" type="button" id="refresh-task">重新复核可用性</button>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="foot-bottom" style="margin-top:0;border-top:0;padding-top:0">
      <span>OSS-Mentor · 任务详情</span>
      <span>不自动领取 Issue · 不自动评论 · 不承诺协作者身份</span>
    </div>
  </div>
</footer>
</body>
</html>
